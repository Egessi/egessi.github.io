<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallTempo — Play Level</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #18191f;
    color: #e2e8f0;
    font-family: 'Space Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
  }
  .logo {
    font-size: 13px;
    letter-spacing: 6px;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    color: #334155;
    margin-bottom: 48px;
  }
  .ball {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #93c5fd, #38bdf8 40%, #0369a1);
    box-shadow: 0 0 40px rgba(56,189,248,0.4);
    margin: 0 auto 32px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(56,189,248,0.4); }
    50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(56,189,248,0.6); }
  }
  .level-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f1f5f9;
    margin-bottom: 8px;
  }
  .opening {
    font-size: 11px;
    letter-spacing: 2px;
    color: #64748b;
    margin-bottom: 40px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s;
    margin-bottom: 12px;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #fff;
    box-shadow: 0 8px 32px rgba(56,189,248,0.35);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.05);
    color: #64748b;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .store-links {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .store-links a {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #64748b;
    font-size: 10px;
    letter-spacing: 2px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .hint {
    font-size: 10px;
    color: #334155;
    letter-spacing: 1px;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">BALLTEMPO</div>
  <div class="subtitle">ONE TAP TIMING</div>
  <div class="ball"></div>
  <div class="level-name" id="levelName">CUSTOM LEVEL</div>
  <div class="opening" id="openingMsg">Opening in BallTempo...</div>

  <a class="btn btn-primary" id="openBtn" href="#">▶ OPEN IN BALLTEMPO</a>
  <div class="hint" id="hintMsg"></div>

  <div class="store-links">
    <a href="https://apps.apple.com/app/balltempo/id6744922635">📱 App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.meghassoft.balltempo">🤖 Google Play</a>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(location.search);
  var code = params.get('c');
  var name = params.get('n');

  if (!code) {
    document.getElementById('levelName').textContent = 'BALLTEMPO';
    document.getElementById('openingMsg').textContent = 'One Tap Timing Game';
    document.getElementById('openBtn').href = 'https://apps.apple.com/app/balltempo/id6744922635';
    document.getElementById('openBtn').textContent = '▶ GET THE APP';
    return;
  }

  // Try to decode level name from code if not passed separately
  if (!name) {
    try {
      var decoded = JSON.parse(atob(code));
      name = decoded.mechName || decoded.name || 'CUSTOM LEVEL';
    } catch(e) { name = 'CUSTOM LEVEL'; }
  }

  document.getElementById('levelName').textContent = name.toUpperCase();

  var deepLink = 'balltempo://play?c=' + encodeURIComponent(code);
  document.getElementById('openBtn').href = deepLink;

  // Auto-open the app
  var opened = false;
  function tryOpen() {
    if (opened) return;
    opened = true;
    window.location.href = deepLink;
    // After a moment, if still on page, show install prompt
    setTimeout(function() {
      document.getElementById('openingMsg').textContent = 'Not installed? Get BallTempo below.';
      document.getElementById('hintMsg').textContent =
        'If the app did not open, install BallTempo first — the level code is saved for you.';
    }, 2500);
  }

  // Delay auto-open slightly so page renders first
  setTimeout(tryOpen, 600);
})();
</script>
</body>
</html>
