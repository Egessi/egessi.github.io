<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BallTempo — Play Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0e14;
    color: #e2e8f0;
    font-family: 'Space Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(56,189,248,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  /* Glow orb */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(56,189,248,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 400px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Logo — replicates the app header ── */
  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 52px;
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(56,189,248,0.12);
    border-radius: 20px;
    width: 100%;
    box-shadow: 0 0 40px rgba(56,189,248,0.05), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* Arena: two walls + ball */
  .arena {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .wall {
    width: 3px;
    height: 44px;
    border-radius: 2px;
    background: linear-gradient(to bottom, transparent, #38bdf8 30%, #38bdf8 70%, transparent);
    box-shadow: 0 0 8px rgba(56,189,248,0.6), 0 0 20px rgba(56,189,248,0.2);
  }
  .arena-ball {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #bae6fd, #38bdf8 40%, #0369a1 72%, #071929 100%);
    box-shadow: 0 0 12px rgba(56,189,248,0.7), 0 0 28px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
    animation: arenaBounce 1.8s ease-in-out infinite;
  }
  @keyframes arenaBounce {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  /* Brand text */
  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand-name {
    font-family: 'Rajdhani', 'Space Mono', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
  }
  .brand-name span:first-child { color: #f1f5f9; }
  .brand-name span:last-child  { color: #38bdf8; }
  .brand-sub {
    font-size: 8px;
    letter-spacing: 4px;
    color: #334155;
    padding-left: 1px;
  }

  /* ── Level info ── */
  .level-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #f1f5f9;
    text-align: center;
    margin-bottom: 6px;
    text-shadow: 0 0 24px rgba(56,189,248,0.25);
  }
  .level-sub {
    font-size: 9px;
    letter-spacing: 3px;
    color: #334155;
    margin-bottom: 36px;
    text-align: center;
  }

  /* ── CTA Button ── */
  .btn-open {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 60%, #0284c7 100%);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(56,189,248,0.4), 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-open::after {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: shimmer 2.8s ease-in-out infinite;
  }
  @keyframes shimmer { 0%{left:-80%} 60%,100%{left:140%} }
  .btn-open:active { transform: scale(0.97); box-shadow: 0 4px 16px rgba(56,189,248,0.3); }

  .btn-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
  }

  /* ── Hint ── */
  .hint {
    font-size: 9px;
    color: transparent;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 36px;
    min-height: 32px;
    transition: color 0.5s;
  }
  .hint.show { color: #475569; }

  /* ── Divider ── */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .div-line { flex:1; height:1px; background:rgba(255,255,255,0.06); }
  .div-txt  { font-size:8px; letter-spacing:2px; color:#1e3a4a; white-space:nowrap; }

  /* ── Store buttons ── */
  .store-links { display:flex; gap:10px; width:100%; }

  .store-link {
    flex: 1;
    padding: 14px 12px;
    border-radius: 14px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .store-link:active { transform: scale(0.96); }

  .store-apple {
    background: #000;
    border: 1px solid #222;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .store-apple svg { fill: #fff; }

  .store-google {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    color: #3c4043;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="card">

  <!-- Logo replicating the app header -->
  <div class="logo-area">
    <div class="arena">
      <div class="wall"></div>
      <div class="arena-ball"></div>
      <div class="wall"></div>
    </div>
    <div class="brand">
      <div class="brand-name">
        <span>BALL</span><span>TEMPO</span>
      </div>
      <div class="brand-sub">ONE TAP TIMING</div>
    </div>
  </div>

  <!-- Level name (shown when ?c= param exists) -->
  <div class="level-name" id="levelName">BALLTEMPO</div>
  <div class="level-sub"  id="levelSub">ONE TAP TIMING GAME</div>

  <!-- CTA -->
  <a class="btn-open" id="openBtn" href="#">
    <div class="btn-icon">▶</div>
    <span id="btnLabel">GET THE APP</span>
  </a>
  <div class="hint" id="hintMsg"></div>

  <!-- Store buttons -->
  <div class="divider">
    <div class="div-line"></div>
    <div class="div-txt">DON'T HAVE THE APP?</div>
    <div class="div-line"></div>
  </div>

  <div class="store-links">
    <a class="store-link store-apple" href="https://apps.apple.com/app/balltempo/id6744922635">
      <svg width="20" height="20" viewBox="0 0 814 1000"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-47.4-148.2-108.8c-49.5-71.4-91.7-181.1-91.7-285.5 0-181 118.1-277 233.9-277 63.6 0 116.2 42.8 155.8 42.8 37.8 0 96.7-44.3 165.6-44.3 26.6 0 108.2 2.6 162.3 100.3zm-219.1-172.3c30.7-36.4 52.5-87.9 52.5-139.3 0-7.1-.6-14.3-1.9-20.1-49.9 1.9-109 33.5-145 70.5-28.8 32.3-55.2 83.9-55.2 136.3 0 7.8 1.3 15.7 1.9 18.3 3.2.6 8.4 1.3 13.6 1.3 44.9 0 101.5-29.4 134.1-66.9z"/></svg>
      APP STORE
    </a>
    <a class="store-link store-google" href="https://play.google.com/store/apps/details?id=com.meghassoft.balltempo">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M4.5 6.4L26 24 4.5 41.6A2 2 0 014 40V8a2 2 0 01.5-1.6z"/>
        <path fill="#FBBC05" d="M4.5 41.6L26 24l6.5 8.4-22.8 13.1a2 2 0 01-5.2-3.9z"/>
        <path fill="#34A853" d="M40.5 20.2L34 24l6.5 3.8 3.5-2a2 2 0 000-3.6l-3.5-2z"/>
        <path fill="#4285F4" d="M4.5 6.4l22.8 13L26 24 4.5 6.4z"/>
        <path fill="#EA4335" d="M34 24l6.5-3.8-8-4.6L26 24l8 4.4z" opacity=".8"/>
      </svg>
      GOOGLE PLAY
    </a>
  </div>

</div>

<script>
(function() {
  var params = new URLSearchParams(location.search);
  var code = params.get('c');
  if (!code) return;

  var name = 'CUSTOM LEVEL';
  try {
    var d = JSON.parse(atob(code));
    name = (d.mechName || d.name || 'CUSTOM LEVEL').toUpperCase();
  } catch(e) {}

  document.getElementById('levelName').textContent = name;
  document.getElementById('levelSub').textContent = 'TAP TO PLAY THIS LEVEL';

  var deepLink = 'balltempo://play?c=' + encodeURIComponent(code);
  var btn = document.getElementById('openBtn');
  btn.href = deepLink;
  document.getElementById('btnLabel').textContent = 'OPEN IN BALLTEMPO';

  setTimeout(function() {
    window.location.href = deepLink;
    setTimeout(function() {
      var h = document.getElementById('hintMsg');
      h.textContent = 'App not opening? Install BallTempo first, then tap the link again.';
      h.classList.add('show');
    }, 2500);
  }, 600);
})();
</script>
</body>
</html>
